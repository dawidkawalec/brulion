name: Captylo
options:
  bundleIdPrefix: pl.craftweb
  deploymentTarget:
    macOS: "14.4"
  xcodeVersion: "26.0"
  developmentLanguage: pl
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.40.0"

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.17.4
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.0

settings:
  base:
    # The app's identity (docs/PRD.md section 4), next to Captylo on the same Mac. Kept in step
    # with the variables at the top of the Makefile and Captylo/App/AppIdentity.swift. The module
    # stays "Captylo" (tests import it).
    APP_PRODUCT_NAME: Szpak
    APP_BUNDLE_ID: pl.craftweb.szpak
    APP_URL_SCHEME: szpak
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ARCHS: arm64
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Local AI helper (docs/local-ai.md): llama.cpp v0.9.0, built by scripts/build-llama-server.sh
    # (make llama) into a shared cache outside the repo; the script reads the commit from here.
    LLAMA_CPP_COMMIT: "cd959bae99ff4bed22bef2604f45241c09bbb8c8"
    LLAMA_SERVER_PATH: "$(HOME)/Library/Caches/Szpak/llama.cpp/$(LLAMA_CPP_COMMIT)/build/bin/llama-server"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Captylo:
    type: application
    platform: macOS
    sources:
      - path: Captylo
        excludes:
          - "**/*.md"
    dependencies:
      - package: FluidAudio
      - package: WhisperKit
        product: WhisperKit
    entitlements:
      path: Captylo/Captylo.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        # Hardened Runtime: without it macOS denies EventKit silently, with no prompt.
        com.apple.security.personal-information.calendars: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: Captylo/Info.plist
      properties:
        CFBundleName: $(APP_PRODUCT_NAME)
        CFBundleDisplayName: $(APP_PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Must stay pl: Polish is the source language and pl.lproj has no Localizable.strings, so
        # with en here a Polish UI reads the English table. A Mac with neither language gets Polish.
        CFBundleDevelopmentRegion: pl
        CFBundleLocalizations: [pl, en]
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: false
        NSHumanReadableCopyright: "Copyright 2026 Dawid Kawalec"
        NSMicrophoneUsageDescription: Szpak nagrywa Twój głos, aby zamienić go na tekst.
        NSAudioCaptureUsageDescription: Szpak nagrywa dźwięk spotkania (głosy rozmówców), aby zrobić z niego transkrypt i notatki.
        NSCalendarsFullAccessUsageDescription: Szpak czyta Twój kalendarz, aby nazwać spotkanie, zapisać uczestników i przypomnieć o nagraniu.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        ITSAppUsesNonExemptEncryption: false
        # Bundled Geologica + Inter (Resources/Fonts, SIL OFL), registered at launch.
        ATSApplicationFontsPath: "."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.movie, org.xiph.ogg-audio, org.xiph.opus]
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [$(APP_URL_SCHEME)]
        # Right click > Usługi > "Popraw w Szpaku" (ManualCorrection, CorrectionServiceProvider).
        # NSRequiredContext (even empty) makes the service on by default.
        NSServices:
          - NSMenuItem:
              default: Popraw w Szpaku
            NSMessage: fixSelection
            NSPortName: $(APP_PRODUCT_NAME)
            NSSendTypes: [public.utf8-plain-text, NSStringPboardType]
            NSRequiredContext: {}
    settings:
      base:
        PRODUCT_NAME: $(APP_PRODUCT_NAME)
        PRODUCT_MODULE_NAME: Captylo
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        # "Embed llama-server" reads the helper from the cache outside the source tree and it may
        # be missing in Debug; a sandboxed script phase can do neither (a declared input that does
        # not exist fails the build). It is the target's only script phase.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # The local AI helper next to the main executable (Bundle.main.url(forAuxiliaryExecutable:)).
      # Debug without it only warns (the app then runs without the local AI), Release fails.
      # Signed here so the app's own signature can seal it; scripts/sign-app.sh re-signs it.
      - name: Embed llama-server
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          DEST="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/llama-server"
          if [ ! -x "$LLAMA_SERVER_PATH" ]; then
            rm -f "$DEST"
            if [ "$CONFIGURATION" = "Release" ]; then
              echo "error: Captylo/LocalAI: no llama-server at $LLAMA_SERVER_PATH (run make llama)"
              exit 1
            fi
            echo "warning: Captylo/LocalAI: no llama-server at $LLAMA_SERVER_PATH, the local AI will not start (run make llama)"
            exit 0
          fi
          ditto "$LLAMA_SERVER_PATH" "$DEST"
          codesign --force --options runtime --timestamp=none --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST"
    scheme:
      testTargets:
        - CaptyloTests
      gatherCoverageData: false

  CaptyloTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CaptyloTests
    dependencies:
      - target: Captylo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/$(APP_PRODUCT_NAME).app/Contents/MacOS/$(APP_PRODUCT_NAME)"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Captylo:
    build:
      targets:
        Captylo: all
        CaptyloTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CaptyloTests
    archive:
      config: Release
