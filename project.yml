name: Captylo
options:
  bundleIdPrefix: pl.craftweb
  deploymentTarget:
    macOS: "14.4"
  xcodeVersion: "26.0"
  developmentLanguage: pl
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.40.0"

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.17.4
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.0

settings:
  base:
    # The fork's working identity (docs/PRD.md section 4), next to Captylo on the same Mac.
    # Renaming the app: these three, the variables at the top of the Makefile and
    # Captylo/App/AppIdentity.swift. The module stays "Captylo" (tests import it).
    APP_PRODUCT_NAME: CaptyloBielik
    APP_BUNDLE_ID: pl.craftweb.captylobielik
    APP_URL_SCHEME: captylobielik
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.17"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ARCHS: arm64
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Captylo:
    type: application
    platform: macOS
    sources:
      - path: Captylo
        excludes:
          - "**/*.md"
    dependencies:
      - package: FluidAudio
      - package: WhisperKit
        product: WhisperKit
    entitlements:
      path: Captylo/Captylo.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        # Hardened Runtime: without it macOS denies EventKit silently, with no prompt.
        com.apple.security.personal-information.calendars: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: Captylo/Info.plist
      properties:
        CFBundleName: $(APP_PRODUCT_NAME)
        CFBundleDisplayName: $(APP_PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Must stay pl: Polish is the source language and pl.lproj has no Localizable.strings, so
        # with en here a Polish UI reads the English table. A Mac with neither language gets Polish.
        CFBundleDevelopmentRegion: pl
        CFBundleLocalizations: [pl, en]
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: false
        NSHumanReadableCopyright: "Copyright 2026 Dawid Kawalec"
        NSMicrophoneUsageDescription: Captylo nagrywa Twój głos, aby zamienić go na tekst.
        NSAudioCaptureUsageDescription: Captylo nagrywa dźwięk spotkania (głosy rozmówców), aby zrobić z niego transkrypt i notatki.
        NSCalendarsFullAccessUsageDescription: Captylo czyta Twój kalendarz, aby nazwać spotkanie, zapisać uczestników i przypomnieć o nagraniu.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        ITSAppUsesNonExemptEncryption: false
        # Bundled Manrope + Inter (Resources/Fonts, SIL OFL), registered at launch.
        ATSApplicationFontsPath: "."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.movie, org.xiph.ogg-audio, org.xiph.opus]
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [$(APP_URL_SCHEME)]
        # Right click > Usługi > "Popraw w Captylo" (ManualCorrection, CorrectionServiceProvider).
        # NSRequiredContext (even empty) makes the service on by default.
        NSServices:
          - NSMenuItem:
              default: Popraw w Captylo
            NSMessage: fixSelection
            NSPortName: $(APP_PRODUCT_NAME)
            NSSendTypes: [public.utf8-plain-text, NSStringPboardType]
            NSRequiredContext: {}
    settings:
      base:
        PRODUCT_NAME: $(APP_PRODUCT_NAME)
        PRODUCT_MODULE_NAME: Captylo
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - CaptyloTests
      gatherCoverageData: false

  CaptyloTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CaptyloTests
    dependencies:
      - target: Captylo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/$(APP_PRODUCT_NAME).app/Contents/MacOS/$(APP_PRODUCT_NAME)"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Captylo:
    build:
      targets:
        Captylo: all
        CaptyloTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CaptyloTests
    archive:
      config: Release
